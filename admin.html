<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم أمواج</title>
<style>
:root{
  --bg:#F6F8FB; --surface:#FFFFFF; --card:#F8FAFC; --border:#E5E9F0;
  --text:#0F172A; --muted:#64748B;
  --primary:#0EA5E9; --primary-dark:#0369A1;
  --green:#10B981; --red:#EF4444; --yellow:#F59E0B; --purple:#8B5CF6;
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;background:var(--bg);
     color:var(--text);min-height:100vh;direction:rtl;line-height:1.6}

/* ── الدخول ── */
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 70% 20%,#0EA5E915 0%,transparent 55%),
             radial-gradient(ellipse at 20% 80%,#8B5CF612 0%,transparent 50%),var(--bg)}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:22px;
  padding:36px 30px;width:100%;max-width:380px;text-align:center;box-shadow:0 10px 40px #0f172a10}
.login-input{width:100%;padding:12px 15px;background:var(--card);border:1.5px solid var(--border);
  border-radius:10px;font-size:16px;font-family:inherit;margin-bottom:12px;outline:none;
  direction:ltr;text-align:left}
.login-input:focus{border-color:var(--primary)}
.login-btn{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:10px;
  font-size:16px;font-weight:800;font-family:inherit;cursor:pointer}
.login-err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px}

/* ── الهيكل ── */
#adminApp{display:none}
.sidebar{position:fixed;top:0;right:0;width:215px;height:100vh;background:var(--surface);
  border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:100;padding:18px 0}
.sidebar-logo{text-align:center;padding:0 16px 16px;border-bottom:1px solid var(--border);margin-bottom:10px}
.sidebar-logo-icon{font-size:30px}
.sidebar-logo-text{font-size:15px;font-weight:900}
.sidebar-logo-sub{font-size:11.5px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;color:var(--muted);
  font-size:14.5px;font-weight:700;border-right:3px solid transparent}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:#0EA5E90D;color:var(--primary);border-right-color:var(--primary)}
.nav-icon{font-size:17px;width:22px;text-align:center}
.nav-badge{margin-right:auto;background:var(--red);color:#fff;border-radius:20px;font-size:11px;
  padding:0 7px;font-weight:800}
.sidebar-footer{margin-top:auto;padding:12px 16px}
.logout-btn{width:100%;padding:9px;background:transparent;border:1.5px solid var(--border);
  border-radius:8px;color:var(--muted);font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer}
.main{margin-right:215px;min-height:100vh}
.top-bar{padding:13px 22px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.top-bar-title{font-size:17px;font-weight:900}
.content{padding:18px 22px}

/* ── عناصر ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:18px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px}
.stat-num{font-size:24px;font-weight:900;line-height:1.15}
.stat-lbl{font-size:12px;color:var(--muted)}
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:16px;overflow:hidden}
.section-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.section-title{font-size:15px;font-weight:900}
.section-body{padding:14px 16px}
.search-input{padding:8px 13px;background:var(--card);border:1.5px solid var(--border);
  border-radius:8px;font-size:13.5px;font-family:inherit;outline:none;min-width:200px}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--border)}
.filter-tab{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);background:transparent;
  color:var(--muted);font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.filter-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tbl-wrap{overflow:auto;max-height:66vh}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--card);position:sticky;top:0;z-index:2;font-size:11.5px;color:var(--muted);
  font-weight:800;text-align:right;padding:9px 11px;border-bottom:1px solid var(--border)}
td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover td{background:#0EA5E906}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
.badge-green{background:#10B98118;color:#047857} .badge-red{background:#EF444418;color:#B91C1C}
.badge-yellow{background:#F59E0B18;color:#B45309} .badge-blue{background:#0EA5E918;color:#0369A1}
.badge-gray{background:#94A3B818;color:#475569}   .badge-purple{background:#8B5CF618;color:#6D28D9}
.action-btn{padding:4px 11px;border-radius:7px;border:1.5px solid;font-size:12px;font-weight:700;
  font-family:inherit;cursor:pointer;background:transparent;margin:0 1px;white-space:nowrap}
.btn-approve{border-color:var(--green);color:var(--green)}
.btn-reject,.btn-delete{border-color:var(--red);color:var(--red)}
.btn-edit{border-color:var(--yellow);color:#B45309}
.btn-view{border-color:var(--primary);color:var(--primary)}
.btn-solid{padding:8px 15px;border-radius:9px;border:none;background:var(--primary);color:#fff;
  font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer}
.btn-solid.green{background:var(--green)} .btn-solid.gray{background:var(--card);color:var(--text);
  border:1px solid var(--border)}
.btn-solid:disabled{opacity:.45;cursor:not-allowed}
.modal-overlay{display:none;position:fixed;inset:0;background:#0f172a99;z-index:999;
  align-items:center;justify-content:center;padding:18px}
.modal-overlay.on{display:flex}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:540px;max-height:90vh;
  overflow-y:auto;padding:22px}
.modal h3{margin:0 0 14px;font-size:17px}
label{display:block;font-size:12.5px;font-weight:700;margin:9px 0 4px;color:var(--muted)}
.modal-input,.modal-select,textarea{width:100%;padding:9px 13px;background:var(--card);
  border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;
  border-radius:11px;padding:11px 20px;font-size:14px;font-weight:700;z-index:9999;display:none;
  box-shadow:0 10px 30px #0f172a40}
.msg{padding:10px 13px;border-radius:9px;font-size:13px;margin:9px 0;display:none}
.msg.err{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;display:block}
.msg.ok{background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46;display:block}
.msg.warn{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;display:block}
.hint{font-size:12px;color:var(--muted)}
.loading{padding:34px;text-align:center;color:var(--muted)}
.drop{border:2px dashed var(--border);border-radius:12px;padding:28px 14px;text-align:center;
  color:var(--muted);cursor:pointer;background:var(--card)}
.drop.hot{border-color:var(--primary);background:#F0F9FF}
.thumb{width:38px;height:38px;border-radius:7px;object-fit:cover;border:1px solid var(--border);background:var(--card)}
@media(max-width:820px){
  .sidebar{width:100%;height:auto;bottom:0;top:auto;flex-direction:row;padding:0;border-left:none;
    border-top:1px solid var(--border);overflow-x:auto}
  .sidebar-logo,.sidebar-footer{display:none}
  .nav-item{flex-direction:column;gap:2px;padding:8px 10px;font-size:10px;border-right:none;
    border-top:3px solid transparent;min-width:64px}
  .nav-item.active{border-right-color:transparent;border-top-color:var(--primary)}
  .nav-badge{display:none}
  .main{margin-right:0;padding-bottom:66px}
  .content{padding:12px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ═══════════ الدخول ═══════════ -->
<div id="loginPage">
  <div class="login-box">
    <img src="https://amwajmob.com/LOGO%20MOB.png" alt="" style="width:74px;height:74px;
         border-radius:18px;object-fit:contain" onerror="this.outerHTML='&lt;div style=&quot;font-size:40px&quot;&gt;🌊&lt;/div&gt;'">
    <div style="font-size:19px;font-weight:900;margin:8px 0 2px">أمواج للإلكترونيات</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:20px">لوحة التحكم</div>

    <div id="lgSetup">
      <!-- الرابط معبّى (مو سر). المفتاح العام تلصقه مرة وحدة بس ويتذكره المتصفح،
           وكلمة سر الإدارة ما تنكتب بأي ملف أبداً. -->
      <input class="login-input" id="lgUrl"  placeholder="رابط المشروع"
             value="https://afbeoibaenzivxqcczdn.supabase.co">
      <input class="login-input" id="lgKey"  type="password" placeholder="المفتاح العام (مرة وحدة بس)">
      <input class="login-input" id="lgPass" type="password" placeholder="كلمة سر الإدارة"
             onkeydown="if(event.key==='Enter')doLogin()">
      <button class="login-btn" onclick="doLogin()">دخول</button>
      <div style="font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.7">
        المفتاح العام تنسخه من ملف <code>activate-test.html</code> عندك،
        أو من Supabase ← Settings ← API Keys
      </div>
    </div>
    <div id="lgQuick" style="display:none">
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px">
        متصل بـ <code id="lgHost"></code></div>
      <input class="login-input" id="lgPass2" type="password" placeholder="كلمة سر الإدارة"
             onkeydown="if(event.key==='Enter')doLogin(true)">
      <button class="login-btn" onclick="doLogin(true)">دخول</button>
      <button class="login-btn" style="background:var(--card);color:var(--muted);margin-top:8px"
              onclick="forgetAll()">تغيير الاتصال</button>
    </div>
    <div class="login-err" id="lgErr"></div>
  </div>
</div>

<!-- ═══════════ اللوحة ═══════════ -->
<div id="adminApp">
  <div class="sidebar">
    <div class="sidebar-logo">
      <img src="https://amwajmob.com/LOGO%20MOB.png" alt="" style="width:42px;height:42px;
           border-radius:11px;object-fit:contain"
           onerror="this.outerHTML='&lt;div class=&quot;sidebar-logo-icon&quot;&gt;🌊&lt;/div&gt;'">
      <div class="sidebar-logo-text">أمواج للإلكترونيات</div>
      <div class="sidebar-logo-sub">لوحة التحكم</div>
    </div>
    <div class="nav-item active" id="nav-home"  onclick="showPage('home')"><span class="nav-icon">📊</span><span>الرئيسية</span></div>
    <div class="nav-item" id="nav-cust"  onclick="showPage('cust')"><span class="nav-icon">👥</span><span>الزبائن</span><span class="nav-badge" id="bgCust" style="display:none">0</span></div>
    <div class="nav-item" id="nav-ord"   onclick="showPage('ord')"><span class="nav-icon">📦</span><span>الطلبات</span><span class="nav-badge" id="bgOrd" style="display:none">0</span></div>
    <div class="nav-item" id="nav-prime" onclick="showPage('prime')"><span class="nav-icon">🚚</span><span>برايم</span></div>
    <div class="nav-item" id="nav-war"   onclick="showPage('war')"><span class="nav-icon">🛡️</span><span>الضمانات</span></div>
    <div class="nav-item" id="nav-cat"   onclick="showPage('cat')"><span class="nav-icon">🗂️</span><span>المواد</span><span class="nav-badge" id="bgCat" style="display:none">0</span></div>
    <div class="nav-item" id="nav-up"    onclick="showPage('up')"><span class="nav-icon">📤</span><span>رفع المخزن</span></div>
    <div class="nav-item" id="nav-bc"    onclick="showPage('bc')"><span class="nav-icon">📢</span><span>الإعلانات</span></div>
    <div class="nav-item" id="nav-set"   onclick="showPage('set')"><span class="nav-icon">🚨</span><span>التنبيهات والدوام</span></div>
    <div class="sidebar-footer">
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:7px;text-align:center" id="sideTime"></div>
      <button class="logout-btn" onclick="doLogout()">🚪 خروج</button>
    </div>
  </div>

  <div class="main">
    <div class="top-bar">
      <div class="top-bar-title" id="pageTitle">الرئيسية</div>
      <button class="btn-solid gray" onclick="refresh()">🔄 تحديث</button>
    </div>
    <div class="content" id="content"><div class="loading">جاري التحميل…</div></div>
  </div>
</div>

<div class="modal-overlay" id="mov" onclick="if(event.target.id==='mov')closeModal()">
  <div class="modal" id="mbox"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════ الأساس ══════════════════════ */
var CFG = {url:'', key:'', pass:''};
var PAGE = 'home';
var F = {cust:'', ord:'', ordRange:'month', prime:'', war:'', cat:'', catKind:'product', catCat:''};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function nf(n){ return (Number(n)||0).toLocaleString('en'); }
function toast(t, ms){ var e=$('toast'); e.textContent=t; e.style.display='block';
  clearTimeout(e._t); e._t=setTimeout(function(){ e.style.display='none'; }, ms||2600); }
function dstr(v){ if(!v) return '—';
  try{ var d=new Date(v); return d.toLocaleDateString('ar-IQ',{year:'numeric',month:'short',day:'numeric'}); }
  catch(e){ return String(v).slice(0,10); } }
function closeModal(){ $('mov').classList.remove('on'); $('mbox').innerHTML=''; }
function modal(html){ $('mbox').innerHTML = html; $('mov').classList.add('on'); }

async function rpc(fn, body){
  var res = await fetch(CFG.url + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{'apikey':CFG.key,'Authorization':'Bearer '+CFG.key,'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({p_key: CFG.pass}, body||{}))
  });
  var t = await res.text(), d;
  try{ d = t ? JSON.parse(t) : null; }catch(e){ d = t; }
  if (!res.ok) throw new Error((d && (d.message||d.hint||d.details)) || ('HTTP '+res.status));
  if (d && d['خطأ']) throw new Error(d['خطأ']);
  return d;
}

/* ⚡ نداء «دالة سيرفر» — للعمليات اللي تحتاج تكلّم برّا (برايم مثلاً).
   قاعدة البيانات ما تگدر تسوي هذا، فتنمر بدالة تشتغل بالسيرفر. */
async function fn(name, body){
  var res = await fetch(CFG.url + '/functions/v1/' + name, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({key: CFG.pass}, body||{}))
  });
  var t = await res.text(), d;
  try{ d = t ? JSON.parse(t) : null; }catch(e){ d = null; }
  if (!d || d.ok !== true) throw new Error((d && d.error) || ('HTTP '+res.status));
  return d;
}

/* ══════════════════════ الدخول ══════════════════════ */
function savedCfg(){
  try{ return JSON.parse(localStorage.getItem('amwaj_sb') || 'null'); }catch(e){ return null; }
}
function initLogin(){
  var c = savedCfg();
  if (c && c.url && c.key){
    CFG = {url:c.url, key:c.key, pass:''};    // الكلمة ما تنحفظ — تنكتب كل مرة
    $('lgSetup').style.display = 'none';
    $('lgQuick').style.display = 'block';
    $('lgHost').textContent = c.url.replace(/^https?:\/\//,'');
    setTimeout(function(){ $('lgPass2').focus(); }, 100);
  }
}
function forgetAll(){
  localStorage.removeItem('amwaj_sb');
  $('lgSetup').style.display='block'; $('lgQuick').style.display='none'; $('lgErr').textContent='';
}
async function doLogin(quick){
  var e = $('lgErr'); e.textContent = '';
  if (quick){ CFG.pass = $('lgPass2').value.trim(); }
  else {
    CFG = {url:$('lgUrl').value.trim().replace(/\/+$/,''),
           key:$('lgKey').value.trim(), pass:$('lgPass').value.trim()};
  }
  if (!CFG.url || !CFG.key || !CFG.pass){ e.textContent = 'عبّي كل الخانات'; return; }
  e.textContent = 'جاري التحقق…';
  try{
    await rpc('web_stats', {});
    /* 🔒 نحفظ الرابط والمفتاح بس — **الكلمة أبداً**.
       الكلمة تبقى بالذاكرة لحد ما تسكّر الصفحة. يعني لو تركت
       الجهاز مفتوح، اللي بعدك ما يلكى شي يدخّله. */
    localStorage.setItem('amwaj_sb', JSON.stringify({ url: CFG.url, key: CFG.key }));
    $('loginPage').style.display = 'none';
    $('adminApp').style.display  = 'block';
    tick(); setInterval(tick, 30000);
    showPage('home');
  }catch(err){ e.textContent = err.message; }
}
function doLogout(){
  var c = savedCfg() || {};
  delete c.pass;                        // نحتفظ بالاتصال، ننسى كلمة السر بس
  localStorage.setItem('amwaj_sb', JSON.stringify(c));
  location.reload();
}
function tick(){
  var d = new Date();
  $('sideTime').textContent = d.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});
}

/* ══════════════════════ التنقّل ══════════════════════ */
var TITLES = {home:'الرئيسية',cust:'الزبائن',ord:'الطلبات',prime:'شحنات برايم',
              war:'الضمانات',cat:'المواد والشاشات',up:'رفع المخزن',bc:'الإعلانات',
              set:'التنبيهات والدوام'};
function showPage(p){
  PAGE = p;
  ['home','cust','ord','prime','war','cat','up','bc','set'].forEach(function(k){
    var el = $('nav-'+k); if (el) el.className = 'nav-item' + (k===p ? ' active' : '');
  });
  $('pageTitle').textContent = TITLES[p] || '';
  $('content').innerHTML = '<div class="loading">جاري التحميل…</div>';
  ({home:pHome,cust:pCust,ord:pOrd,prime:pPrime,war:pWar,cat:pCat,up:pUp,bc:pBc,set:pSet})[p]();
}

/* ══════════════════════ رفع الصور للسيرفر ══════════════════════ */
/* 🖼️ الصورة من الموبايل ~4 ميجا. نصغّرها بالمتصفح لـ~60 كيلو قبل الرفع،
   فتفتح فوراً عند الزبون بدل ما ينتظرها. */
var UPFX = null;
async function uploadPrefix(){
  if (UPFX) return UPFX;
  var r = await rpc('web_upload_prefix', {});
  UPFX = r.prefix;
  return UPFX;
}
function shrink(file, maxPx, quality){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      URL.revokeObjectURL(url);
      var w = img.width, h = img.height, m = maxPx || 1000;
      if (w > m || h > m){ var s = m / Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);       // خلفية بيضاء بدل الشفاف
      ctx.drawImage(img, 0, 0, w, h);
      c.toBlob(function(b){ b ? res(b) : rej(new Error('ما قدرت أعالج الصورة')); },
               'image/jpeg', quality || 0.82);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('الملف مو صورة')); };
    img.src = url;
  });
}
async function uploadImage(file, folder, nameHint){
  if (!/^image\//.test(file.type)) throw new Error('اختار صورة');
  var pfx  = await uploadPrefix();
  var blob = await shrink(file, 1000, 0.82);
  var safe = String(nameHint||'img').replace(/[^A-Za-z0-9_-]/g,'') || 'img';
  var path = pfx + '/' + folder + '/' + safe + '-' + Date.now() + '.jpg';
  var res  = await fetch(CFG.url + '/storage/v1/object/' + 'catalog/' + path, {
    method:'POST',
    headers:{'apikey':CFG.key,'Authorization':'Bearer '+CFG.key,
             'Content-Type':'image/jpeg','x-upsert':'true'},
    body: blob });
  if (!res.ok){
    var t = await res.text();
    throw new Error('فشل الرفع: ' + t.slice(0,120));
  }
  return CFG.url + '/storage/v1/object/public/catalog/' + path;
}
function pickImage(cb){
  var i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*';

/* 🧾 نفس شكل تفاصيل المادة اللي بالتطبيق — حتى اللي تشوفه انت هو نفسه

     الشاشة     : الاسم · الماركة · النوع · الملاحظة · السعر
     باقي المواد: الاسم · السعر */
function oiRow(k, v, ltr){
  return '<div style="display:flex;gap:8px;padding:3px 0;font-size:12.5px;'+
    'border-top:1px dashed var(--border)">'+
    '<span style="color:var(--muted);font-weight:700;min-width:62px">'+esc(k)+'</span>'+
    '<span style="font-weight:800;flex:1"'+(ltr?' dir="ltr"':'')+'>'+esc(v)+'</span></div>';
}
function orderItemHtml(i){
  var price = Number(i['السعر'])||0, qty = Number(i['الكمية'])||1;
  var isScreen = !!(String(i['النوع']||'').trim() || String(i['الملاحظة']||'').trim());
  var rows = '';
  if (isScreen){
    if (String(i['الماركة']||'').trim()) rows += oiRow('الماركة', i['الماركة']);
    if (String(i['النوع']||'').trim())    rows += oiRow('النوع', i['النوع']);
    if (String(i['الملاحظة']||'').trim()) rows += oiRow('الملاحظة', i['الملاحظة']);
  }
  rows += oiRow('السعر', nf(price)+' د.ع', true);
  if (qty > 1) rows += oiRow('المجموع', nf(price*qty)+' د.ع', true);
  return '<div style="padding:11px 13px;border-bottom:1px solid var(--border)">'+
    '<div style="display:flex;gap:8px;align-items:baseline">'+
      '<div style="font-weight:900;font-size:13.5px;flex:1">'+esc(i['الاسم'])+'</div>'+
      '<span class="badge badge-blue">× '+qty+'</span></div>'+
    (i['الكود'] ? '<div class="hint" dir="ltr" style="font-size:11px">'+esc(i['الكود'])+'</div>' : '')+
    '<div style="margin-top:6px">'+rows+'</div></div>';
}

/* ⏳ لازم يطابق حساب السيرفر (interval '1 month'/'1 year').
   JS العادي يزحف: 31 كانون + شهر = 3 آذار، وPostgres يعطي 28 شباط. */
function addMonths(iso, months, years){
  var p = iso.split('-'), y = +p[0], m = +p[1]-1, day = +p[2];
  y += (years||0); m += (months||0);
  y += Math.floor(m/12); m = ((m%12)+12)%12;
  var last = new Date(Date.UTC(y, m+1, 0)).getUTCDate();
  return y+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+Math.min(day,last)).slice(-2);
}
function warrantyEnd(kind, s){ return kind==='battery' ? addMonths(s,0,1) : addMonths(s,1,0); }

    if (e.dataTransfer.files[0]) upFile(e.dataTransfer.files[0]); };

function upKind(k){ UP.kind=k; pUp(); }
var SKIP_TABS = ['fcm_tokens','_sync_snapshot'];
function upFile(f){
  UP.file = f.name; UP.rows = null; UP.renames = [];
  $('uRes').innerHTML = ''; $('bApply').style.display='none';
  var isCsv = /\.csv$/i.test(f.name), rd = new FileReader();
  rd.onload = function(){
    try{
      var table = isCsv ? parseCsv(rd.result) : parseXlsx(rd.result);
      buildRows(table);
    }catch(err){ var m=$('uFile'); m.className='msg err'; m.textContent='ما قدرت أقرا الملف: '+err.message; }
  };
  if (isCsv) rd.readAsText(f,'utf-8'); else rd.readAsArrayBuffer(f);
}
function parseXlsx(buf){
  if (typeof XLSX === 'undefined')
    throw new Error('مكتبة الإكسل ما تحمّلت (الإنترنت). احفظ الملف CSV UTF-8 وارفعه.');
  var wb = XLSX.read(buf,{type:'array'});
  var want = UP.kind==='screens' ? ['SHEET'] : ['INVENTORY'];
  var name = wb.SheetNames.find(function(n){ return want.indexOf(n)>=0; })
          || wb.SheetNames.find(function(n){ return SKIP_TABS.indexOf(n)<0; });
  if (!name) throw new Error('ما لقيت تبويب فيه بيانات');
  UP.file += ' › ' + name;
  return XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
}
function parseCsv(text){
  var out=[],row=[],cur='',q=false; text=text.replace(/^﻿/,'');
  for (var i=0;i<text.length;i++){ var c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if (c==='"') q=true;
    else if (c===',') { row.push(cur); cur=''; }
    else if (c==='\n'){ row.push(cur); out.push(row); row=[]; cur=''; }
    else if (c!=='\r') cur+=c; }
  if (cur!=='' || row.length){ row.push(cur); out.push(row); }
  return out;
}
function col(h, names, fb){ for (var i=0;i<names.length;i++){ var j=h.indexOf(names[i]); if (j>=0) return j; } return fb; }
function num(v){ var n=parseInt(String(v==null?'':v).replace(/[^0-9-]/g,''),10); return isNaN(n)?0:n; }
function numN(v){ var s=String(v==null?'':v).replace(/[^0-9.]/g,''); if(!s) return null;
  var n=Math.round(parseFloat(s)); return isNaN(n)?null:n; }
function buildRows(table){
  if (!table || table.length<2) throw new Error('الملف فارغ');
  var h = (table[0]||[]).map(function(x){ return String(x==null?'':x).trim().toLowerCase(); });
  var rows = [];
  if (UP.kind==='parts'){
    var ci = {name:col(h,['name','الاسم'],0), qty:col(h,['qty','الرصيد','الكمية'],1),
              price:col(h,['price','مفرد','السعر'],2)};
    for (var i=1;i<table.length;i++){ var r=table[i]; if(!r) continue;
      var nm=String(r[ci.name]==null?'':r[ci.name]).trim(); if(!nm) continue;
      rows.push({name:nm, qty:num(r[ci.qty]), price:numN(r[ci.price])}); }
  } else {
    var cs = {brand:col(h,['brand','الماركة'],0), name:col(h,['name','الاسم'],1),
              type:col(h,['type','النوع'],2), notes:col(h,['notes','الملاحظة'],3),
              price:col(h,['price','السعر'],4), qty:col(h,['qty','الكمية'],5)};
    for (var j=1;j<table.length;j++){ var s=table[j]; if(!s) continue;
      var n2=String(s[cs.name]==null?'':s[cs.name]).trim(); if(!n2) continue;
      rows.push({brand:String(s[cs.brand]==null?'':s[cs.brand]).trim(), name:n2,
        type:String(s[cs.type]==null?'':s[cs.type]).trim(),
        notes:String(s[cs.notes]==null?'':s[cs.notes]).trim(),
        qty:num(s[cs.qty]), price:numN(s[cs.price])}); }
  }
  if (!rows.length) throw new Error('ما لقيت ولا صف فيه اسم');
  UP.rows = rows;
  var m = $('uFile'); m.className='msg ok';
  m.textContent = '✅ ' + UP.file + ' — ' + rows.length.toLocaleString('en') + ' صف جاهز';
  $('uBtns').style.display = 'flex';
}
async function upRun(dry){
  if (!UP.rows){ toast('اختار ملف أول'); return; }
  var rens = (UP.kind==='parts' && !dry) ? pickedRen() : [];
  if (!dry){
    var q = 'راح ينطبّق التغيير على المخزن فعلاً.';
    if (rens.length) q += '\n\nومنها '+rens.length+' مادة يتحدّث اسمها بنفس الكود.';
    if (!confirm(q+'\n\nمتأكد؟')) return;
  }
  var m = $('uMsg'); m.className='msg warn'; m.textContent = dry ? 'دا أحسب…' : 'دا أطبّق…';
  $('bPrev').disabled = true; $('bApply').disabled = true;
  try{
    var body = {p_rows:UP.rows, p_source:UP.file, p_dry:dry};
    if (UP.kind==='parts') body.p_renames = rens;
    var res = await rpc(UP.kind==='screens' ? 'web_import_screens' : 'web_import_parts', body);
    renderUp(res, dry);
    if (dry){ $('bApply').style.display='inline-block';
      m.className='msg warn'; m.textContent='⚠️ معاينة — ما انطبّق شي. راجع واضغط تطبيق.'; }
    else { m.className='msg ok'; m.textContent='✅ انطبّق — استلام رقم '+(res['رقم_الاستلام']||'?');
      $('bApply').style.display='none'; upHist(); }
  }catch(e){ m.className='msg err'; m.textContent = e.message; }
  $('bPrev').disabled = false; $('bApply').disabled = false;
}

      '<table><thead><tr><th><input type="checkbox" id="renAll" checked onchange="renToggle(this)"></th>'+
      '<th>الاسم الجديد</th><th>كان اسمه</th><th>الدليل</th></tr></thead><tbody>'+
      RC.map(function(x,i){
        var s = !!x['قوي'];

          '<td><input type="checkbox" class="renChk" data-i="'+i+'"'+(s?' checked data-strong="1"':'')+'></td>'+
          '<td><b>'+esc(x['الاسم_الجديد'])+'</b><div class="hint">'+esc(x['القسم_الجديد'])+'</div></td>'+
          '<td>'+esc(x['الاسم_القديم'])+'<div class="hint">'+esc(x['القسم_القديم'])+' · '+esc(x['الكود'])+'</div></td>'+

          ' <span class="hint">'+Math.round((x['التشابه']||0)*100)+'%</span></td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  h += upList('🆕 المواد الجديدة كلياً', r['قائمة_الجديد'], r['جديد']) +
       upList('🔄 اللي رجعت للتوفر', r['قائمة_الراجع'], r['رجع_للتوفر']);

function upList(t, arr, total){
  if (!arr || !arr.length) return '';

    esc(t)+' ('+(total||arr.length)+')</summary>'+

function renToggle(el){
  var b = document.querySelectorAll('.renChk');
  for (var i=0;i<b.length;i++) if (b[i].getAttribute('data-strong')==='1') b[i].checked = el.checked;

function pickedRen(){
  var out=[], b=document.querySelectorAll('.renChk');
  for (var i=0;i<b.length;i++){ if(!b[i].checked) continue;
    var c = RC[Number(b[i].getAttribute('data-i'))];
    if (c) out.push({new_norm:c['name_norm'], old_code:c['الكود']}); }
  return out;

async function upHist(){
  try{
    var out = await rpc('web_receipts',{p_limit:10}), rs = out['البيانات']||[];
    $('uHist').innerHTML = rs.length ?
      '<table><thead><tr><th>#</th><th>التاريخ</th><th>النوع</th><th>🆕</th><th>🔄</th><th>📊</th>'+
      '<th>الملف</th><th></th></tr></thead><tbody>'+rs.map(function(x){
        return '<tr><td>'+x.id+'</td><td class="hint">'+dstr(x.created_at)+'</td>'+
          '<td>'+(x.kind==='screens'?'شاشات':'مواد')+'</td><td>'+x.count_new+'</td>'+
          '<td>'+x.count_restock+'</td><td>'+x.count_qty+'</td>'+
          '<td class="hint" style="max-width:200px">'+esc(x.source_file||'—')+'</td>'+
          '<td>'+(x.reverted_at ? '<span class="badge badge-gray">متراجَع</span>'
            : '<button class="action-btn btn-delete" onclick="upRevert('+x.id+')">↩️ تراجع</button>')+
          '</td></tr>'; }).join('')+'</tbody></table>'
      : '<div class="loading">ماكو استلامات بعد</div>';
  }catch(e){ $('uHist').innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }
}
async function upRevert(id){
  if (!confirm('يرجّع المخزن مثل ما كان قبل الاستلام '+id+'.\n\nمتأكد؟')) return;
  try{ var r = await rpc('web_import_revert',{p_receipt_id:id});
       toast('✅ '+(r['الحالة']||'تم')); upHist(); }
  catch(e){ toast('⚠️ '+e.message, 4000); }
}

initLogin();
